<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blixora Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { padding: 2rem; }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: #ff6b35; }
        p { font-size: 1.2rem; color: #8b949e; margin-bottom: 2rem; }
        .btn {
            background: #ff6b35;
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #e55a25; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blixora Labs</h1>
        <p>Welcome to our Simulation Portal</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</body>
</html>
